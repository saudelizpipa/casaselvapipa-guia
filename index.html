<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Casa Selva – Guia da casa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Casa Selva brand: logo olive green + terracotta sun + pool teal on cream. Phone-first: house photo, logo panel, sticky chapter bar, stacked chapters. */
  --jungle:#3a4924;
  --jungle-2:#4d5f33;
  --leaf:#5b7340;
  --ocean:#1b7a78;
  --sun:#c8774e;
  --cream:#fefef6;
  --paper:#fbfaf1;
  --card:#ffffff;
  --ink:#1c2621;
  --muted:#5b6a62;
  --line:#dfe4da;
  --todo-bg:#fff4cf;
  --todo-line:#d9a520;
  --display:"Fraunces", Georgia, "Times New Roman", serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.55 var(--body)}
a{color:var(--ocean)}
h1,h2,h3{font-family:var(--display);font-weight:600;text-wrap:balance;margin:0}
button{font:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:6px}

/* HERO */
.hero{background:var(--cream);color:var(--ink)}
.photo{position:relative;height:clamp(280px,75vw,460px);overflow:hidden;background:var(--jungle)}
.photo img{width:100%;height:100%;object-fit:cover;object-position:center 40%;display:block}
.langs{position:absolute;top:14px;right:14px;display:flex;gap:4px;background:rgba(30,38,18,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:4px;border-radius:999px}
.langs button{border:0;background:transparent;color:#fff;padding:6px 11px;border-radius:999px;font-weight:600;font-size:13px;letter-spacing:.04em;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--cream);color:var(--jungle)}
.brand-panel{position:relative;max-width:720px;margin:-56px auto 0;background:var(--cream);border-radius:28px 28px 0 0;padding:22px 20px 8px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.brand-panel .logo{width:min(190px,50vw);height:auto;display:block}
.hero h1{font-size:30px;line-height:1.1;font-weight:400;font-style:italic;color:var(--jungle)}
.hero p{margin:0;max-width:34em;color:var(--muted);font-size:16px}

/* QUICK TILES */
.quick{max-width:720px;margin:-2px auto 0;padding:18px 16px 4px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile.wide{grid-column:1 / -1}
.tile .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
.tile .val{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.wifi{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end}
.wifi .val{font-size:17px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;background:var(--jungle);color:#fff;padding:10px 14px;font-weight:600;font-size:14px;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn.alt{background:var(--ocean)}
.btn.ghost{background:transparent;color:var(--jungle);border:1.5px solid var(--jungle)}
.contact{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.contact .who{font-weight:600}
.contact .num{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}

/* NAV */
nav.chapters{position:sticky;top:0;z-index:5;background:rgba(245,246,240,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin-top:14px}
nav.chapters .track{max-width:720px;margin:0 auto;display:flex;gap:6px;overflow-x:auto;padding:10px 16px;scrollbar-width:none}
nav.chapters .track::-webkit-scrollbar{display:none}
nav.chapters button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:500;cursor:pointer}
nav.chapters button.on{background:var(--jungle);color:#fff;border-color:var(--jungle)}

/* CHAPTERS */
main{max-width:720px;margin:0 auto;padding:8px 16px 40px;display:flex;flex-direction:column;gap:40px}
section{scroll-margin-top:64px;display:flex;flex-direction:column;gap:14px;padding-top:18px}
.kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--ocean);font-variant-numeric:tabular-nums}
section h2{font-size:30px;line-height:1.1}
section p{margin:0;max-width:65ch}
.lead{font-size:17px;color:var(--ink)}
.note{background:#e7f1ee;border-left:4px solid var(--ocean);padding:12px 14px;border-radius:0 10px 10px 0;font-size:15px}
.note.warn{background:#fdf3dc;border-left-color:var(--sun)}
.note strong{display:block;margin-bottom:2px}

.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.list li{padding:12px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:132px 1fr;gap:12px}
.list li b{font-weight:600}
@media (max-width:440px){.list li{grid-template-columns:1fr;gap:2px}}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px}
.card h3{font-size:20px}
.card .tag{font-size:12px;font-weight:600;color:var(--leaf);text-transform:uppercase;letter-spacing:.08em}
.card p{font-size:15px;color:var(--ink)}
.card .meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:6px}
.card a.map{font-size:14px;font-weight:600;text-decoration:none}
.tide{display:inline-flex;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:#fdf3dc;color:#8a5d00}
.tide.ok{background:#e3f0e8;color:var(--jungle-2)}

.rules{list-style:none;margin:0;padding:0;counter-reset:r;display:flex;flex-direction:column;gap:10px}
.rules li{counter-increment:r;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px 12px 52px;position:relative}
.rules li::before{content:counter(r,decimal-leading-zero);position:absolute;left:14px;top:12px;font-family:var(--display);font-size:20px;color:var(--ocean);font-variant-numeric:tabular-nums;line-height:1.2}

.sos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.sos a{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 10px;text-align:center;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:2px}
.sos a .n{font-family:var(--display);font-size:34px;color:#b23a2a;line-height:1}
.sos a .w{font-size:13px;color:var(--muted);font-weight:600}

.check{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.check label{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--leaf);flex:0 0 auto;margin:1px 0 0}
.check input:checked + span{color:var(--muted);text-decoration:line-through}
.progress{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}

.hint{margin:8px 0 0;font-size:13px;color:var(--muted)}
h3.sub{font-size:22px;margin-top:6px}
h3.sub.small{font-family:var(--body);font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:var(--ocean);margin-top:4px}
/* LANGUAGE CHOICE */
.splash{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;background-color:var(--jungle);background-size:cover;background-position:center}
.splash[hidden]{display:none}
.splash-card{background:var(--cream);border-radius:24px;padding:26px 22px 22px;width:100%;max-width:360px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.splash-card .logo{width:140px;height:auto}
.splash-q{margin:0;font-size:14px;line-height:1.5;color:var(--muted)}
.splash-langs{display:grid;gap:10px;width:100%}
.splash-langs button{border:1.5px solid var(--jungle);background:#fff;color:var(--jungle);border-radius:14px;padding:14px;font-size:18px;font-weight:600;cursor:pointer}
.splash-langs button:hover,.splash-langs button:focus-visible{background:var(--jungle);color:#fff}
nav.chapters button.langbtn{background:var(--sun);border-color:var(--sun);color:#fff;font-weight:700;display:inline-flex;align-items:center;gap:6px}
nav.chapters button.langbtn svg{width:16px;height:16px}
.todo{display:inline-block;background:var(--todo-bg);border:1.5px dashed var(--todo-line);color:#6b4d00;border-radius:6px;padding:0 6px;font-size:.9em;font-weight:600}

footer{background:var(--jungle);color:#cfe0d5;text-align:center;padding:28px 20px 36px;display:flex;flex-direction:column;gap:6px;font-size:14px}
footer .brand{font-family:var(--display);font-size:24px;color:#f3efe2;font-style:italic}
footer a{color:var(--sun)}

@media (max-width:420px){
  .wifi{grid-template-columns:1fr 1fr}
  .wifi .btn{grid-column:1 / -1}
  .sos a .n{font-size:28px}
}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
</style>
</head>
<body>
<div class="splash" id="splash" role="dialog" aria-modal="true" aria-labelledby="splashQ" hidden>
  <div class="splash-card">
    <img class="logo" id="splashLogo" alt="Casa Selva – Pipa, Brasil">
    <p class="splash-q" id="splashQ">Escolha o idioma<br>Choose your language<br>Choisissez votre langue<br>Elija su idioma</p>
    <div class="splash-langs">
      <button type="button" data-lang="pt">Português</button>
      <button type="button" data-lang="en">English</button>
      <button type="button" data-lang="fr">Français</button>
      <button type="button" data-lang="es">Español</button>
    </div>
  </div>
</div>

/* ---------------- RENDER ---------------- */
const IDS = ["chegada","casa","regras","praias","comer","passeios","noite","pratico","emergencia","saida"];
let lang = "pt";
let checks = {};
try { checks = JSON.parse(localStorage.getItem("cs-checks") || "{}"); } catch(e) {}

function pickLang(){
  try { const s = localStorage.getItem("cs-lang"); if (s && T[s]) return s; } catch(e) {}
  return "pt";
}

function card(title, tag, desc, q, extra, L){
  return `<article class="card"><span class="tag">${tag}</span><h3>${title}</h3><p>${desc}</p>
    <div class="meta">${extra || "<span></span>"}<a class="map" href="${q.startsWith("http") ? q : maps(q)}">${L.ui.map} &rarr;</a></div></article>`;
}

function render(){
  const L = T[lang];
  document.documentElement.lang = L.htmlLang;
  document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  document.getElementById("heroTitle").innerHTML = L.title;
  document.getElementById("heroIntro").textContent = L.intro;
  document.getElementById("footLine").textContent = L.foot;

  const host = isTodo(CONFIG.localWhatsApp) ? null : wa(CONFIG.localWhatsApp);
  document.getElementById("quick").innerHTML = `
    <div class="tile wide"><span class="lbl">${L.ui.wifi}</span>
      <div class="wifi">
        <div><div class="lbl">${L.ui.net}</div><div class="val">${V("wifiName")}</div></div>
        <div><div class="lbl">${L.ui.pass}</div><div class="val">${V("wifiPass")}</div></div>
        <button class="btn" type="button" id="copyBtn">${L.ui.copy}</button>
      </div><p class="hint">${L.ui.wifiHint}</p></div>
    <div class="tile"><span class="lbl">${L.ui.in}</span><span class="val">${V("checkin")}</span></div>
    <div class="tile"><span class="lbl">${L.ui.out}</span><span class="val">${V("checkout")}</span></div>
    <div class="tile wide"><div class="contact">
      <div><div class="lbl">${L.ui.ask}</div><div class="who">${V("localName")}</div><div class="num">${V("localWhatsApp")}</div></div>
      ${host ? `<a class="btn alt" href="${host}">${L.ui.write}</a>` : `<span class="btn alt" aria-disabled="true">${L.ui.write}</span>`}
    </div></div>`;

  document.getElementById("copyBtn").onclick = async (e) => {
    const b = e.currentTarget;
    try { await navigator.clipboard.writeText(CONFIG.wifiPass); b.textContent = L.ui.copied; }
    catch(err) { b.textContent = L.ui.copyFail; }
    setTimeout(() => { b.textContent = L.ui.copy; }, 2000);
  };

  document.getElementById("navTrack").innerHTML =
    `<button type="button" class="langbtn" id="langBtn" aria-label="Language"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg>${lang.toUpperCase()}</button>` +
    L.nav.map((n,i) => `<button type="button" data-target="${IDS[i]}">${n}</button>`).join("");
  document.querySelectorAll("#navTrack button[data-target]").forEach(b => b.onclick = () =>
    document.getElementById(b.dataset.target).scrollIntoView({block:"start"}));
  document.getElementById("langBtn").onclick = openSplash;

  const beaches = BEACHES.map(b => card(b.name, L.beaches[b.id][0], L.beaches[b.id][1], b.q,
    `<span class="tide ${b.low ? "" : "ok"}">${b.low ? L.ui.lowOnly : L.ui.anyTide}</span>`, L)).join("");
  const bfast = BREAKFAST.map(f => card(f.name, L.breakfast[f.id][0], L.breakfast[f.id][1], f.q, "", L)).join("");
  const night = NIGHT.map(n => card(n.name, L.night[n.id][0], L.night[n.id][1], n.q, "", L)).join("");
  const quick = QUICK.map(f => card(f.name, L.quick[f.id][0], L.quick[f.id][1], f.q, "", L)).join("");
  const near = NEAR.map(f => card(f.name, L.near[f.id][0], L.near[f.id][1], f.q, "", L)).join("");
  const food = FOOD.map(f => card(f.name, L.food[f.id][0], L.food[f.id][1], f.q, "", L)).join("");
  const todo = DO.map(d => card(L.todo[d.id][0], "", L.todo[d.id][1], d.q, "", L)).join("").replace(/<span class="tag"><\/span>/g,"");
  const done = L.leave.filter((_,i) => checks["c"+i]).length;
  const leave = L.leave.map((t,i) => `<li><label for="c${i}"><input type="checkbox" id="c${i}" ${checks["c"+i] ? "checked" : ""}><span>${t}</span></label></li>`).join("");

  const sec = (i, body) => `<section id="${IDS[i]}"><span class="kicker">${String(i+1).padStart(2,"0")} / ${String(IDS.length).padStart(2,"0")}</span><h2>${L.nav[i]}</h2>${body}</section>`;

  document.getElementById("main").innerHTML = [
    sec(0, L.arrival),
    sec(1, L.house),
    sec(2, L.rules),
    sec(3, L.beachesIntro + `<div class="cards">${beaches}</div>` + L.cliffs),
    sec(4, `<h3 class="sub">${L.breakfastTitle}</h3><div class="cards">${bfast}</div><h3 class="sub">${L.foodTitle}</h3>` + L.foodIntro + `<h3 class="sub small">${L.nearTitle}</h3><div class="cards">${near}</div><h3 class="sub small">${L.centreTitle}</h3><div class="cards">${food}</div><h3 class="sub small">${L.quickTitle}</h3><div class="cards">${quick}</div>` + L.foodNote),
    sec(5, L.doIntro + `<div class="cards">${todo}</div>`),
    sec(6, L.nightIntro + `<div class="cards">${night}</div>`),
    sec(7, L.practical),
    sec(8, L.sosIntro + `<div class="sos">
        <a href="tel:192"><span class="n">192</span><span class="w">${L.sos[0]}</span></a>
        <a href="tel:193"><span class="n">193</span><span class="w">${L.sos[1]}</span></a>
        <a href="tel:190"><span class="n">190</span><span class="w">${L.sos[2]}</span></a></div>` + L.sosMore),
    sec(9, L.leaveIntro + `<ul class="check">${leave}</ul><p class="progress" id="prog">${done} / ${L.leave.length} ${L.ui.done}</p>` + L.leaveEnd)
  ].join("");

  document.querySelectorAll(".check input").forEach(inp => inp.onchange = () => {
    checks[inp.id] = inp.checked;
    try { localStorage.setItem("cs-checks", JSON.stringify(checks)); } catch(e) {}
    const n = L.leave.filter((_,i) => checks["c"+i]).length;
    document.getElementById("prog").textContent = `${n} / ${L.leave.length} ${L.ui.done}`;
  });

  observeNav();
}

let io;
function observeNav(){
  if (io) io.disconnect();
  if (!("IntersectionObserver" in window)) return;
  io = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (!en.isIntersecting) return;
      document.querySelectorAll("#navTrack button[data-target]").forEach(b => {
        const on = b.dataset.target === en.target.id;
        b.classList.toggle("on", on);
        if (on) b.scrollIntoView({inline:"center", block:"nearest"});
      });
    });
  }, {rootMargin:"-30% 0px -65% 0px"});
  IDS.forEach(id => { const el = document.getElementById(id); if (el) io.observe(el); });
}

function setLang(l){
  lang = l;
  try { localStorage.setItem("cs-lang", lang); } catch(e) {}
  render();
}
function openSplash(){
  const sp = document.getElementById("splash");
  sp.hidden = false;
  document.body.style.overflow = "hidden";
  const first = sp.querySelector(`button[data-lang="${lang}"]`) || sp.querySelector("button");
  first.focus();
}
function closeSplash(){
  document.getElementById("splash").hidden = true;
  document.body.style.overflow = "";
}
document.querySelectorAll(".langs button").forEach(b => b.onclick = () => setLang(b.dataset.lang));
document.querySelectorAll(".splash-langs button").forEach(b => b.onclick = () => {
  setLang(b.dataset.lang);
  closeSplash();
  window.scrollTo(0, 0);
});
(function(){
  const sp = document.getElementById("splash");
  const photo = document.querySelector(".photo img");
  sp.style.backgroundImage = `linear-gradient(rgba(30,38,18,.45),rgba(30,38,18,.7)), url("${photo.src}")`;
  document.getElementById("splashLogo").src = document.querySelector(".brand-panel .logo").src;
})();

let chosen = null;
try { chosen = localStorage.getItem("cs-lang"); } catch(e) {}
lang = pickLang();
render();
if (!chosen || !T[chosen]) openSplash();
</script>
</body>
</html>
